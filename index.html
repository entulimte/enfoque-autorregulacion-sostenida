<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Biofeedback - Autorregulación Sostenida</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #00f2fe;
      --danger-color: #f43f5e;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Cero scroll en móvil */
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 12px;
    }

    /* Encabezado */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      border-bottom: 1px solid #334155;
    }

    h1 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    /* Barra Superior Ultra Compacta (Duración + Visor Dedo) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .selector-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #334155;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    /* Visor Dedo Micro */
    .mini-visor {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    .camera-frame {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      overflow: hidden;
      background: #000;
      flex-shrink: 0;
    }

    video#camera-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .visor-label {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Cuadro Central de la Bolita Flotante */
    .stage-card {
      background: var(--card-bg);
      width: 100%;
      flex-grow: 1;
      margin: 6px 0;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #334155;
    }

    .zone-indicator {
      position: absolute;
      top: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      text-align: center;
    }

    .orb {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, var(--accent-color));
      box-shadow: 0 0 25px var(--accent-color);
      position: absolute;
      top: 65%;
      transition: top 0.8s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s, box-shadow 0.5s;
    }

    .orb.floating {
      top: 22%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #00f2fe);
      box-shadow: 0 0 35px #00f2fe;
    }

    .orb.dropping {
      top: 70%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #f43f5e);
      box-shadow: 0 0 20px #f43f5e;
    }

    /* Botón Iniciar Sesión (Abajo de la Bolita) */
    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #0f172a;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }

    .btn-main.active {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #fff;
    }

    /* Cuadro Inferior con Histórico y Resultados */
    .results-card {
      background: var(--card-bg);
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .results-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-color);
      font-weight: 700;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr;
      gap: 6px;
    }

    .metric-box {
      background: var(--bg-color);
      padding: 6px;
      border-radius: 8px;
      text-align: center;
    }

    .metric-val {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-color);
    }

    .metric-val.accent {
      color: var(--accent-color);
    }

    .metric-lbl {
      font-size: 0.62rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 1px;
    }

    canvas#ppg-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header>
    <h1>Autorregulación Sostenida</h1>
    <span style="font-size:0.68rem; color:var(--text-muted)">Biofeedback Cardio-Atencional</span>
  </header>

  <!-- Barra Superior (Configuración + Visor Micro) -->
  <div class="top-bar">
    <div class="selector-group">
      <label for="session-duration">Sesión:</label>
      <select id="session-duration">
        <option value="1">1 min</option>
        <option value="3">3 min</option>
        <option value="5" selected>5 min</option>
        <option value="10">10 min</option>
      </select>
    </div>

    <div class="mini-visor">
      <div class="camera-frame">
        <video id="camera-preview" autoplay playsinline muted></video>
      </div>
      <span class="visor-label">Sensor Dedo</span>
    </div>
  </div>

  <!-- Cuadro Central de la Bolita Flotante -->
  <div class="stage-card">
    <div id="zone-status" class="zone-indicator">Zona: ≤ 70 BPM (Atención Interna Estrecha)</div>
    <div id="bio-orb" class="orb"></div>
  </div>

  <!-- Botón Iniciar Sesión abajo del Cuadro de la Bolita -->
  <button id="btn-toggle" class="btn-main">Iniciar Sesión</button>

  <!-- Anexo Inferior de Resultados e Histórico -->
  <div class="results-card">
    <div class="results-title">Resultados de Evaluación</div>
    <div class="metrics-grid">
      <div class="metric-box">
        <div id="bpm-display" class="metric-val">--</div>
        <div class="metric-lbl">BPM Actual</div>
      </div>

      <div class="metric-box">
        <div id="timer-display" class="metric-val">05:00</div>
        <div class="metric-lbl">Tiempo</div>
      </div>

      <div class="metric-box">
        <div id="target-percent-display" class="metric-val accent">0%</div>
        <div class="metric-lbl">% En Zona (≤70 BPM)</div>
      </div>
    </div>
  </div>

  <canvas id="ppg-canvas" width="60" height="60"></canvas>

  <script>
    let isRunning = false;
    let stream = null;
    let audioCtx = null;
    let timerInterval = null;
    let ppgInterval = null;
    
    let totalSessionSeconds = 300;
    let secondsRemaining = 300;
    let secondsInTargetZone = 0;
    let totalMeasuredSeconds = 0;

    let currentBPM = 0;
    let wasOutOfZone = false;

    const redHistory = [];
    const historySize = 90;
    let lastBeatTime = 0;

    const btnToggle = document.getElementById('btn-toggle');
    const selectDuration = document.getElementById('session-duration');
    const videoPreview = document.getElementById('camera-preview');
    const bpmDisplay = document.getElementById('bpm-display');
    const timerDisplay = document.getElementById('timer-display');
    const targetPercentDisplay = document.getElementById('target-percent-display');
    const bioOrb = document.getElementById('bio-orb');
    const zoneStatus = document.getElementById('zone-status');
    const canvas = document.getElementById('ppg-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    selectDuration.addEventListener('change', () => {
      if (!isRunning) {
        totalSessionSeconds = parseInt(selectDuration.value) * 60;
        secondsRemaining = totalSessionSeconds;
        updateTimerDisplay();
      }
    });

    function updateTimerDisplay() {
      const mins = Math.floor(secondsRemaining / 60).toString().padStart(2, '0');
      const secs = (secondsRemaining % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }

    btnToggle.addEventListener('click', () => {
      if (!isRunning) {
        startSession();
      } else {
        stopSession();
      }
    });

    async function startSession() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });

        videoPreview.srcObject = stream;
        await videoPreview.play();

        try {
          const track = stream.getVideoTracks()[0];
          if (track && typeof track.getCapabilities === 'function') {
            const capabilities = track.getCapabilities();
            if (capabilities.torch) {
              await track.applyConstraints({ advanced: [{ torch: true }] });
            }
          }
        } catch (e) {}

        totalSessionSeconds = parseInt(selectDuration.value) * 60;
        secondsRemaining = totalSessionSeconds;
        secondsInTargetZone = 0;
        totalMeasuredSeconds = 0;
        wasOutOfZone = false;
        
        isRunning = true;
        btnToggle.textContent = 'Detener Sesión';
        btnToggle.classList.add('active');

        updateTimerDisplay();
        targetPercentDisplay.textContent = "0%";
        
        timerInterval = setInterval(tickTimer, 1000);
        ppgInterval = setInterval(processPPGFrame, 33);

      } catch (err) {
        alert("Otorga permisos de cámara para continuar.");
      }
    }

    function processPPGFrame() {
      if (!isRunning || videoPreview.readyState !== videoPreview.HAVE_ENOUGH_DATA) return;

      ctx.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);
      const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      let redSum = 0;
      for (let i = 0; i < frameData.length; i += 4) {
        redSum += frameData[i];
      }

      const avgRed = redSum / (frameData.length / 4);
      
      if (avgRed < 45) {
        bpmDisplay.textContent = "--";
        zoneStatus.textContent = "Cubre el lente y flash con tu dedo";
        return;
      }

      redHistory.push({ time: performance.now(), val: avgRed });
      if (redHistory.length > historySize) redHistory.shift();

      detectHeartbeat();
    }

    function detectHeartbeat() {
      if (redHistory.length < 30) return;

      const values = redHistory.map(d => d.val);
      const max = Math.max(...values);
      const min = Math.min(...values);
      const threshold = min + (max - min) * 0.65;

      const latest = redHistory[redHistory.length - 1];
      const previous = redHistory[redHistory.length - 2];

      if (previous.val < threshold && latest.val >= threshold) {
        const now = latest.time;
        if (lastBeatTime > 0) {
          const delta = now - lastBeatTime;
          if (delta > 450 && delta < 1300) {
            const instantBPM = Math.round(60000 / delta);
            currentBPM = currentBPM === 0 ? instantBPM : Math.round(currentBPM * 0.6 + instantBPM * 0.4);
            updateBiofeedbackUI(currentBPM);
          }
        }
        lastBeatTime = now;
      }
    }

    function updateBiofeedbackUI(bpm) {
      bpmDisplay.textContent = bpm;

      if (bpm <= 70) {
        bioOrb.className = "orb floating";
        zoneStatus.textContent = "En Zona: ≤ 70 BPM (Atención Interna Estrecha)";
        zoneStatus.style.color = "#00f2fe";
        wasOutOfZone = false;
      } else {
        bioOrb.className = "orb dropping";
        zoneStatus.textContent = "Fuera de Zona: > 70 BPM";
        zoneStatus.style.color = "#f43f5e";

        if (!wasOutOfZone) {
          playAlertSound();
          wasOutOfZone = true;
        }
      }
    }

    function playAlertSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch(e) {}
    }

    function tickTimer() {
      if (!isRunning) return;

      secondsRemaining--;
      totalMeasuredSeconds++;

      if (currentBPM > 0 && currentBPM <= 70) {
        secondsInTargetZone++;
      }

      if (totalMeasuredSeconds > 0) {
        const pct = Math.round((secondsInTargetZone / totalMeasuredSeconds) * 100);
        targetPercentDisplay.textContent = `${pct}%`;
      }

      updateTimerDisplay();

      if (secondsRemaining <= 0) {
        stopSession();
      }
    }

    function stopSession() {
      isRunning = false;
      clearInterval(timerInterval);
      clearInterval(ppgInterval);

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      btnToggle.textContent = 'Iniciar Sesión';
      btnToggle.classList.remove('active');
      bioOrb.className = "orb";
      bpmDisplay.textContent = "--";
      zoneStatus.textContent = "Zona: ≤ 70 BPM (Atención Interna Estrecha)";
      zoneStatus.style.color = "#f8fafc";
    }
  </script>
</body>
</html>
