<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Biofeedback - Autorregulación Sostenida</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #00f2fe;
      --danger-color: #f43f5e;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    /* Header Compacto */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      border-bottom: 1px solid #334155;
    }

    h1 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    /* Barra Superior */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .selector-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    select {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid #334155;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .mini-visor {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      padding: 3px 8px;
      border-radius: 15px;
      border: 1px solid #334155;
    }

    .camera-frame {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--accent-color);
      overflow: hidden;
      background: #000;
    }

    video#camera-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .visor-label {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* Zona Principal de Trabajo */
    .stage-card {
      background: var(--card-bg);
      width: 100%;
      min-height: 220px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #334155;
    }

    .zone-indicator {
      position: absolute;
      top: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      text-align: center;
      border: 1px solid #334155;
    }

    .orb {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, var(--accent-color));
      box-shadow: 0 0 25px var(--accent-color);
      position: absolute;
      top: 65%;
      transition: top 0.8s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s, box-shadow 0.5s;
    }

    .orb.floating {
      top: 25%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #00f2fe);
      box-shadow: 0 0 35px #00f2fe;
    }

    .orb.dropping {
      top: 70%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #f43f5e);
      box-shadow: 0 0 20px #f43f5e;
    }

    /* Botón Iniciar */
    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .btn-main.active {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #fff;
    }

    /* Panel de Métricas */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 8px;
    }

    .metric-box {
      background: var(--card-bg);
      padding: 8px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }

    .metric-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-color);
    }

    .metric-val.accent {
      color: var(--accent-color);
    }

    .metric-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Sección Histórico de Registros */
    .history-card {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: var(--danger-color);
      font-size: 0.7rem;
      cursor: pointer;
    }

    .history-list {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      border: 1px solid #334155;
    }

    .history-item-date {
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .history-item-val {
      font-weight: 700;
      color: var(--accent-color);
    }

    canvas#ppg-canvas { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Autorregulación Sostenida</h1>
    <span style="font-size:0.7rem; color:var(--text-muted)">Biofeedback</span>
  </header>

  <div class="top-bar">
    <div class="selector-group">
      <label for="session-duration">Sesión:</label>
      <select id="session-duration">
        <option value="1">1 min</option>
        <option value="3">3 min</option>
        <option value="5" selected>5 min</option>
        <option value="10">10 min</option>
      </select>
    </div>

    <div class="mini-visor">
      <div class="camera-frame">
        <video id="camera-preview" autoplay playsinline muted></video>
      </div>
      <span class="visor-label">Sensor Dedo</span>
    </div>
  </div>

  <!-- Zona Central Trabajo -->
  <div class="stage-card">
    <div id="zone-status" class="zone-indicator">Zona: ≤ 70 BPM (Atención Interna Estrecha)</div>
    <div id="bio-orb" class="orb"></div>
  </div>

  <button id="btn-toggle" class="btn-main">Iniciar Sesión</button>

  <!-- Métricas en Vivo -->
  <div class="metrics-grid">
    <div class="metric-box">
      <div id="bpm-display" class="metric-val">--</div>
      <div class="metric-lbl">BPM Actual</div>
    </div>
    <div class="metric-box">
      <div id="timer-display" class="metric-val">05:00</div>
      <div class="metric-lbl">Tiempo</div>
    </div>
    <div class="metric-box">
      <div id="target-percent-display" class="metric-val accent">0%</div>
      <div class="metric-lbl">% En Zona</div>
    </div>
  </div>

  <!-- Panel de Histórico de Sesiones -->
  <div class="history-card">
    <div class="history-header">
      <span class="history-title">Histórico de Sesiones</span>
      <button id="btn-clear-history" class="btn-clear">Borrar Histórico</button>
    </div>
    <div id="history-list" class="history-list">
      <div style="font-size:0.75rem; color:var(--text-muted); text-align:center;">Sin sesiones registradas</div>
    </div>
  </div>

  <canvas id="ppg-canvas" width="60" height="60"></canvas>

  <script>
    let isRunning = false;
    let stream = null;
    let audioCtx = null;
    let timerInterval = null;
    let ppgInterval = null;
    
    let totalSessionSeconds = 300;
    let secondsRemaining = 300;
    let secondsInTargetZone = 0;
    let totalMeasuredSeconds = 0;

    let currentBPM = 0;
    let wasOutOfZone = false;

    let redHistory = [];
    const historySize = 60;
    let lastBeatTime = 0;

    const btnToggle = document.getElementById('btn-toggle');
    const selectDuration = document.getElementById('session-duration');
    const videoPreview = document.getElementById('camera-preview');
    const bpmDisplay = document.getElementById('bpm-display');
    const timerDisplay = document.getElementById('timer-display');
    const targetPercentDisplay = document.getElementById('target-percent-display');
    const bioOrb = document.getElementById('bio-orb');
    const zoneStatus = document.getElementById('zone-status');
    const historyList = document.getElementById('history-list');
    const btnClearHistory = document.getElementById('btn-clear-history');
    const canvas = document.getElementById('ppg-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Cargar Histórico Guardado al iniciar
    loadHistoryUI();

    selectDuration.addEventListener('change', () => {
      if (!isRunning) {
        totalSessionSeconds = parseInt(selectDuration.value) * 60;
        secondsRemaining = totalSessionSeconds;
        updateTimerDisplay();
      }
    });

    function updateTimerDisplay() {
      const mins = Math.floor(secondsRemaining / 60).toString().padStart(2, '0');
      const secs = (secondsRemaining % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }

    btnToggle.addEventListener('click', () => {
      if (!isRunning) {
        startSession();
      } else {
        stopSession();
      }
    });

    btnClearHistory.addEventListener('click', () => {
      localStorage.removeItem('biofeedback_history');
      loadHistoryUI();
    });

    async function startSession() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 320 }, height: { ideal: 240 } }
        });

        videoPreview.srcObject = stream;
        await videoPreview.play();

        try {
          const track = stream.getVideoTracks()[0];
          if (track && track.applyConstraints) {
            await track.applyConstraints({ advanced: [{ torch: true }] });
          }
        } catch (e) {}

        totalSessionSeconds = parseInt(selectDuration.value) * 60;
        secondsRemaining = totalSessionSeconds;
        secondsInTargetZone = 0;
        totalMeasuredSeconds = 0;
        wasOutOfZone = false;
        currentBPM = 0;
        redHistory = [];
        lastBeatTime = 0;

        isRunning = true;
        btnToggle.textContent = 'Detener Sesión';
        btnToggle.classList.add('active');

        updateTimerDisplay();
        targetPercentDisplay.textContent = "0%";
        bpmDisplay.textContent = "--";
        
        timerInterval = setInterval(tickTimer, 1000);
        ppgInterval = setInterval(processPPGFrame, 30);

      } catch (err) {
        alert("Otorga permisos de cámara para continuar.");
      }
    }

    function processPPGFrame() {
      if (!isRunning || videoPreview.readyState !== videoPreview.HAVE_ENOUGH_DATA) return;

      ctx.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);
      const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      let redSum = 0;
      for (let i = 0; i < frameData.length; i += 4) {
        redSum += frameData[i];
      }

      const avgRed = redSum / (frameData.length / 4);
      
      if (avgRed < 30) {
        bpmDisplay.textContent = "--";
        zoneStatus.textContent = "Cubre la cámara y el flash con tu dedo";
        return;
      }

      redHistory.push({ time: performance.now(), val: avgRed });
      if (redHistory.length > historySize) redHistory.shift();

      detectHeartbeat();
    }

    function detectHeartbeat() {
      if (redHistory.length < 20) return;

      const values = redHistory.map(d => d.val);
      const max = Math.max(...values);
      const min = Math.min(...values);
      const threshold = min + (max - min) * 0.55;

      const latest = redHistory[redHistory.length - 1];
      const previous = redHistory[redHistory.length - 2];

      if (previous.val < threshold && latest.val >= threshold) {
        const now = latest.time;
        if (lastBeatTime > 0) {
          const delta = now - lastBeatTime;
          if (delta > 400 && delta < 1500) {
            const instantBPM = Math.round(60000 / delta);
            currentBPM = currentBPM === 0 ? instantBPM : Math.round(currentBPM * 0.7 + instantBPM * 0.3);
            updateBiofeedbackUI(currentBPM);
          }
        }
        lastBeatTime = now;
      }
    }

    function updateBiofeedbackUI(bpm) {
      bpmDisplay.textContent = bpm;

      if (bpm <= 70) {
        bioOrb.className = "orb floating";
        zoneStatus.textContent = "En Zona: ≤ 70 BPM (Atención Interna Estrecha)";
        zoneStatus.style.color = "#00f2fe";
        wasOutOfZone = false;
      } else {
        bioOrb.className = "orb dropping";
        zoneStatus.textContent = "Fuera de Zona: > 70 BPM";
        zoneStatus.style.color = "#f43f5e";

        if (!wasOutOfZone) {
          playAlertSound();
          wasOutOfZone = true;
        }
      }
    }

    function playAlertSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch(e) {}
    }

    function tickTimer() {
      if (!isRunning) return;

      secondsRemaining--;
      totalMeasuredSeconds++;

      if (currentBPM > 0 && currentBPM <= 70) {
        secondsInTargetZone++;
      }

      if (totalMeasuredSeconds > 0) {
        const pct = Math.round((secondsInTargetZone / totalMeasuredSeconds) * 100);
        targetPercentDisplay.textContent = `${pct}%`;
      }

      updateTimerDisplay();

      if (secondsRemaining <= 0) {
        stopSession();
      }
    }

    function stopSession() {
      isRunning = false;
      clearInterval(timerInterval);
      clearInterval(ppgInterval);

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      if (totalMeasuredSeconds > 0) {
        const pctFinal = Math.round((secondsInTargetZone / totalMeasuredSeconds) * 100);
        const mins = Math.floor(totalMeasuredSeconds / 60);
        const secs = totalMeasuredSeconds % 60;
        
        saveSessionToHistory(pctFinal, `${mins}m ${secs}s`);
      }

      btnToggle.textContent = 'Iniciar Sesión';
      btnToggle.classList.remove('active');
      bioOrb.className = "orb";
      bpmDisplay.textContent = "--";
      zoneStatus.textContent = "Zona: ≤ 70 BPM (Atención Interna Estrecha)";
      zoneStatus.style.color = "#f8fafc";
    }

    function saveSessionToHistory(pct, durationStr) {
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem('biofeedback_history')) || [];
        if (!Array.isArray(history)) history = [];
      } catch (e) {
        history = [];
      }

      const now = new Date();
      const dateStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} - ${now.getDate()}/${now.getMonth()+1}`;

      history.unshift({ date: dateStr, pct: pct, duration: durationStr });
      localStorage.setItem('biofeedback_history', JSON.stringify(history));

      loadHistoryUI();
    }

    function loadHistoryUI() {
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem('biofeedback_history')) || [];
        if (!Array.isArray(history)) history = [];
      } catch (e) {
        history = [];
      }

      if (history.length === 0) {
        historyList.innerHTML = `<div style="font-size:0.75rem; color:var(--text-muted); text-align:center;">Sin sesiones registradas</div>`;
        return;
      }

      historyList.innerHTML = history.map((item, idx) => `
        <div class="history-item">
          <div>
            <div>Sesión ${history.length - idx}</div>
            <div class="history-item-date">${item.date} (${item.duration})</div>
          </div>
          <div class="history-item-val">${item.pct}% en zona</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
