<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biofeedback - Autorregulación Sostenida</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #00f2fe;
      --danger-color: #f43f5e;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--accent-color);
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Controles de Sesión */
    .controls-card {
      background: var(--card-bg);
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .selector-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    select {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-main {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-main.active {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #fff;
    }

    /* Visor de Cámara de Guía */
    .visor-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: 5px 0;
      width: 100%;
    }

    .camera-frame {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid var(--accent-color);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
      overflow: hidden;
      background: #000;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video#camera-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .visor-placeholder {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      pointer-events: none;
    }

    .visor-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Métricas */
    .metrics-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
    }

    .metric-box {
      text-align: center;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-color);
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Esfera de Biofeedback */
    .stage-card {
      background: var(--card-bg);
      width: 100%;
      height: 240px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      border: 1px solid #334155;
    }

    .zone-indicator {
      position: absolute;
      top: 10px;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
    }

    .orb {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, var(--accent-color));
      box-shadow: 0 0 25px var(--accent-color);
      position: absolute;
      top: 70%;
      transition: top 0.8s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s, box-shadow 0.5s;
    }

    .orb.floating {
      top: 20%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #00f2fe);
      box-shadow: 0 0 30px #00f2fe;
    }

    .orb.dropping {
      top: 75%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #f43f5e);
      box-shadow: 0 0 20px #f43f5e;
    }

    /* Modal Reporte Final */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
    }

    .modal-title {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--accent-color);
    }

    .report-stat {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 15px 0;
      color: var(--text-color);
    }

    canvas#ppg-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Autorregulación Sostenida</h1>
      <p class="subtitle">Biofeedback Cardio-Atencional</p>
    </header>

    <!-- Controles -->
    <div class="controls-card">
      <div class="selector-group">
        <label for="session-duration">Duración de sesión:</label>
        <select id="session-duration">
          <option value="1">1 minuto</option>
          <option value="3">3 minutos</option>
          <option value="5" selected>5 minutos</option>
          <option value="10">10 minutos</option>
          <option value="15">15 minutos</option>
          <option value="30">30 minutos</option>
        </select>
      </div>

      <button id="btn-toggle" class="btn-main">Iniciar Sesión</button>
    </div>

    <!-- Visor de Cámara Guía -->
    <div class="visor-container">
      <div class="camera-frame">
        <video id="camera-preview" autoplay playsinline muted></video>
        <div id="visor-placeholder" class="visor-placeholder">
          <span style="font-size: 1.2rem; margin-bottom:2px;">📷</span>
          <span>VISOR DEDO</span>
        </div>
      </div>
      <p id="visor-hint" class="visor-hint">Presiona "Iniciar Sesión" y cubre el lente con tu dedo índice</p>
    </div>

    <!-- Métricas en tiempo real -->
    <div class="metrics-row">
      <div class="metric-box">
        <div id="bpm-display" class="metric-value">--</div>
        <div class="metric-label">BPM Actual</div>
      </div>
      <div class="metric-box">
        <div id="timer-display" class="metric-value">05:00</div>
        <div class="metric-label">Tiempo</div>
      </div>
    </div>

    <!-- Escenario de la Esfera -->
    <div class="stage-card">
      <div id="zone-status" class="zone-indicator">Zona Objetivo: ≤ 70 BPM</div>
      <div id="bio-orb" class="orb"></div>
    </div>
  </div>

  <!-- Modal de Reporte -->
  <div id="report-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 class="modal-title">Sesión Finalizada</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Porcentaje de tiempo en autorregulación (≤ 70 BPM):</p>
      <div id="report-percentage" class="report-stat">0%</div>
      <p id="report-summary" style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;"></p>
      <button id="btn-close-modal" class="btn-main" style="width: 100%;">Aceptar</button>
    </div>
  </div>

  <!-- Canvas oculto para análisis PPG -->
  <canvas id="ppg-canvas" width="60" height="60"></canvas>

  <script>
    // Variables de Estado
    let isRunning = false;
    let stream = null;
    let audioCtx = null;
    let timerInterval = null;
    let ppgInterval = null;
    
    let totalSessionSeconds = 300;
    let secondsRemaining = 300;
    let secondsInTargetZone = 0;
    let totalMeasuredSeconds = 0;

    let currentBPM = 0;
    let wasOutOfZone = false;

    // Buffer PPG
    const redHistory = [];
    const historySize = 150;
    let lastBeatTime = 0;

    // Elementos DOM
    const btnToggle = document.getElementById('btn-toggle');
    const selectDuration = document.getElementById('session-duration');
    const videoPreview = document.getElementById('camera-preview');
    const visorPlaceholder = document.getElementById('visor-placeholder');
    const visorHint = document.getElementById('visor-hint');
    const bpmDisplay = document.getElementById('bpm-display');
    const timerDisplay = document.getElementById('timer-display');
    const bioOrb = document.getElementById('bio-orb');
    const zoneStatus = document.getElementById('zone-status');
    const canvas = document.getElementById('ppg-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const modal = document.getElementById('report-modal');
    const reportPercentage = document.getElementById('report-percentage');
    const reportSummary = document.getElementById('report-summary');
    const btnCloseModal = document.getElementById('btn-close-modal');

    // Inicializar reloj
    selectDuration.addEventListener('change', () => {
      if (!isRunning) {
        totalSessionSeconds = parseInt(selectDuration.value) * 60;
        secondsRemaining = totalSessionSeconds;
        updateTimerDisplay();
      }
    });

    function updateTimerDisplay() {
      const mins = Math.floor(secondsRemaining / 60).toString().padStart(2, '0');
      const secs = (secondsRemaining % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }

    btnToggle.addEventListener('click', () => {
      if (!isRunning) {
        startSession();
      } else {
        stopSession(false);
      }
    });

    btnCloseModal.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // Iniciar Sesión y Cámara
    async function startSession() {
      try {
        // 1. Audio Context para alertas
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        // 2. Acceso a Cámara
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });

        videoPreview.srcObject = stream;
        await videoPreview.play();

        // Ocultar placeholder del visor
        visorPlaceholder.style.display = 'none';
        visorHint.textContent = "Cubre el lente completamente con la yema de tu dedo";

        // 3. Encender Flash/Torch sin bloquear si falla
        try {
          const track = stream.getVideoTracks()[0];
          if (track && typeof track.getCapabilities === 'function') {
            const capabilities = track.getCapabilities();
            if (capabilities.torch) {
              await track.applyConstraints({ advanced: [{ torch: true }] });
            }
          }
        } catch (e) {
          console.log("Flash no disponible en este navegador/dispositivo:", e);
        }

        // Reset Métricas
        totalSessionSeconds = parseInt(selectDuration.value) * 60;
        secondsRemaining = totalSessionSeconds;
        secondsInTargetZone = 0;
        totalMeasuredSeconds = 0;
        wasOutOfZone = false;
        
        isRunning = true;
        btnToggle.textContent = 'Detener Sesión';
        btnToggle.classList.add('active');

        // Timers
        updateTimerDisplay();
        timerInterval = setInterval(tickTimer, 1000);
        ppgInterval = setInterval(processPPGFrame, 33);

      } catch (err) {
        alert("Atención: Permite el acceso a la cámara cuando el navegador te lo solicite.");
        console.error("Error al iniciar cámara:", err);
      }
    }

    // Procesamiento PPG
    function processPPGFrame() {
      if (!isRunning || videoPreview.readyState !== videoPreview.HAVE_ENOUGH_DATA) return;

      ctx.drawImage(videoPreview, 0, 0, canvas.width, canvas.height);
      const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      let redSum = 0;
      for (let i = 0; i < frameData.length; i += 4) {
        redSum += frameData[i];
      }

      const avgRed = redSum / (frameData.length / 4);
      
      if (avgRed < 50) {
        bpmDisplay.textContent = "--";
        zoneStatus.textContent = "Cubre bien la cámara con tu dedo";
        return;
      }

      redHistory.push({ time: performance.now(), val: avgRed });
      if (redHistory.length > historySize) redHistory.shift();

      detectHeartbeat();
    }

    // Detección de picos
    function detectHeartbeat() {
      if (redHistory.length < 50) return;

      const values = redHistory.map(d => d.val);
      const max = Math.max(...values);
      const min = Math.min(...values);
      const threshold = min + (max - min) * 0.7;

      const latest = redHistory[redHistory.length - 1];
      const previous = redHistory[redHistory.length - 2];

      if (previous.val < threshold && latest.val >= threshold) {
        const now = latest.time;
        if (lastBeatTime > 0) {
          const delta = now - lastBeatTime;
          if (delta > 450 && delta < 1300) {
            const instantBPM = Math.round(60000 / delta);
            currentBPM = currentBPM === 0 ? instantBPM : Math.round(currentBPM * 0.7 + instantBPM * 0.3);
            updateBiofeedbackUI(currentBPM);
          }
        }
        lastBeatTime = now;
      }
    }

    function updateBiofeedbackUI(bpm) {
      bpmDisplay.textContent = bpm;

      if (bpm <= 70) {
        bioOrb.className = "orb floating";
        zoneStatus.textContent = "Autorregulación Sostenida (En Zona)";
        zoneStatus.style.color = "#00f2fe";
        wasOutOfZone = false;
      } else {
        bioOrb.className = "orb dropping";
        zoneStatus.textContent = "Frecuencia Elevada (> 70 BPM)";
        zoneStatus.style.color = "#f43f5e";

        if (!wasOutOfZone) {
          playAlertSound();
          wasOutOfZone = true;
        }
      }
    }

    function playAlertSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(380, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch(e) {}
    }

    function tickTimer() {
      if (!isRunning) return;

      secondsRemaining--;
      totalMeasuredSeconds++;

      if (currentBPM > 0 && currentBPM <= 70) {
        secondsInTargetZone++;
      }

      updateTimerDisplay();

      if (secondsRemaining <= 0) {
        stopSession(true);
      }
    }

    function stopSession(completed = false) {
      isRunning = false;
      clearInterval(timerInterval);
      clearInterval(ppgInterval);

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      btnToggle.textContent = 'Iniciar Sesión';
      btnToggle.classList.remove('active');
      visorPlaceholder.style.display = 'flex';
      visorHint.textContent = 'Presiona "Iniciar Sesión" y cubre el lente con tu dedo índice';
      bioOrb.className = "orb";
      bpmDisplay.textContent = "--";

      if (completed || totalMeasuredSeconds > 10) {
        showReport();
      }
    }

    function showReport() {
      const percentage = totalMeasuredSeconds > 0 
        ? Math.round((secondsInTargetZone / totalMeasuredSeconds) * 100) 
        : 0;

      reportPercentage.textContent = `${percentage}%`;
      reportSummary.textContent = `Mantuviste la frecuencia en ≤70 BPM durante ${secondsInTargetZone} de los ${totalMeasuredSeconds} segundos evaluados.`;
      modal.style.display = 'flex';
    }
  </script>
</body>
</html>
